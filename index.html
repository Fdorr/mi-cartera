<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b5c">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://accounts.google.com/gsi/client" async></script>
<link rel="icon" href="icon-192.png">
<title>Mi Cartera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna tipo app movil, barra inferior de 5 pestañas, hoja inferior para formularios */
:root{
  --bg:#f6f7f8; --surface:#ffffff; --fg:#14181b; --muted:#6b7479; --line:#e3e6e8;
  --accent:#0f6b5c; --accent-fg:#ffffff; --warn:#a15c07; --warn-bg:#fbf1dd; --bad:#a3302b; --good:#1c7a46;
  --c1:#0f6b5c; --c2:#3a6ea5; --c3:#c9822b; --c4:#7a5ea8; --c5:#b24a6b; --c6:#7d8a91;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-num:'DM Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1314; --surface:#171c1e; --fg:#e8ecee; --muted:#8c979c; --line:#262d30;
  --accent:#4fc1ab; --accent-fg:#0a1a17; --warn:#e8b157; --warn-bg:#2a2210; --bad:#ef8680; --good:#6bd196;
  --c1:#4fc1ab; --c2:#7aa7da; --c3:#e0a050; --c4:#a98fd6; --c5:#dd7e9c; --c6:#8c979c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1314; --surface:#171c1e; --fg:#e8ecee; --muted:#8c979c; --line:#262d30;
  --accent:#4fc1ab; --accent-fg:#0a1a17; --warn:#e8b157; --warn-bg:#2a2210; --bad:#ef8680; --good:#6bd196;
  --c1:#4fc1ab; --c2:#7aa7da; --c3:#e0a050; --c4:#a98fd6; --c5:#dd7e9c; --c6:#8c979c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 96px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1{font-size:13px;font-weight:500;color:var(--muted);margin:0;letter-spacing:.04em;text-transform:uppercase}
h2{font-size:17px;font-weight:600;margin:0 0 10px}
.muted{color:var(--muted)}
.sm{font-size:12.5px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.top>:nth-child(2){margin-left:auto}
.eye{background:none;border:1px solid var(--line);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;color:var(--muted);flex:none;padding:0}
.eye svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ex{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.big{font-size:34px;font-weight:500;letter-spacing:-.02em;margin:4px 0 0}
.sec{margin-top:26px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);background:transparent;border-radius:20px;padding:6px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.leg{flex:1;min-width:150px;display:grid;gap:6px;font-size:13px}
.leg div{display:flex;justify-content:space-between;gap:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:16px;display:flex;gap:8px}
.list{border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row>div:first-child{min-width:0}
.row small{display:block;color:var(--muted);font-size:12.5px}
.row .r{text-align:right;flex:none}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px}
.bl{margin-bottom:14px;font-size:14px}
.bl .t{display:flex;justify-content:space-between;gap:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs div{max-width:480px;margin:0 auto;display:flex}
.tab{flex:1;background:none;border:0;padding:10px 0 9px;font-size:11.5px;color:var(--muted);display:grid;justify-items:center;gap:3px}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-fg);border:0;border-radius:28px;padding:13px 18px;font-weight:600;z-index:4}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:12px 16px;font-weight:600;width:100%}
.btn.sec2{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.link{background:none;border:0;color:var(--bad);width:auto;padding:8px 0;font-weight:500}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 4px}
input,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end}
.sheet>div{background:var(--surface);width:100%;max-width:480px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lock{min-height:100vh;display:grid;align-content:center;gap:12px;max-width:340px;margin:0 auto;padding:24px 16px;text-align:center}
.lock .logo{width:54px;height:54px;border-radius:16px;background:var(--accent);margin:0 auto 6px;display:grid;place-items:center}
.lock .logo svg{width:28px;height:28px;stroke:var(--accent-fg);fill:none;stroke-width:1.7;stroke-linecap:round}
.err{color:var(--bad);font-size:13px;min-height:18px}
.aviso{display:flex;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.aviso b{display:block;font-weight:600;font-size:14.5px}
.pill{flex:none;width:8px;border-radius:4px;background:var(--warn)}
.pill.i{background:var(--c2)} .pill.ok{background:var(--good)}
pre{white-space:pre-wrap;font-family:var(--f-num);font-size:12px;background:var(--bg);border-radius:10px;padding:10px;margin:8px 0 0}
</style>

</head><body>
<div id="lock" class="lock">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M4 17l5-6 4 3 7-8"/><path d="M4 21h16"/></svg></div>
  <h2 style="margin:0" id="lt">Mi Cartera</h2>
  <p class="muted sm" style="margin:0 0 6px" id="hint" hidden>Tus datos se cifran en este celular con esta contraseña. Si la olvidás, no se pueden recuperar. Usá una frase de varias palabras.</p>
  <input id="pw" type="password" placeholder="Contraseña maestra" autocomplete="off" aria-label="Contraseña maestra">
  <input id="pw2" type="password" placeholder="Repetir contraseña" autocomplete="off" aria-label="Repetir contraseña" hidden>
  <div id="lerr" class="err" role="alert"></div>
  <button class="btn" id="go">Desbloquear</button>
  <button class="btn sec2" id="fp" hidden>Entrar con huella</button>
  <button class="btn sec2" id="rst" hidden>Ya tengo una copia en Google Drive</button>
</div>

<div id="app" hidden>
  <div class="wrap" id="view"></div>
  <button class="fab" id="fab" aria-label="Agregar inversión">+ Agregar</button>
  <nav class="tabs"><div id="tabs"></div></nav>
</div>
<div id="sheet" class="sheet" hidden></div>

<script>
const ICON={
  home:'<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/>',
  list:'<path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',
  chart:'<path d="M12 3v9h9"/><path d="M20 15a8.5 8.5 0 11-11-10"/>',
  bell:'<path d="M6 17V11a6 6 0 0112 0v6l1.5 2h-15z"/><path d="M10 21h4"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>'
};
const TABS=[['home','Resumen'],['list','Inversiones'],['chart','Gráficos'],['bell','Avisos'],['gear','Ajustes']];
const TYPES=['Cripto','Stablecoin','ETF','Fondo','Efectivo'];
let FX=1450; // pesos por dólar, editable en Ajustes
const SAMPLE={
  plats:[
    {id:1,name:'Binance',on:1},{id:2,name:'Nexo',on:1},{id:3,name:'Ledger',on:1},{id:4,name:'Dólares físicos',on:1},
    {id:5,name:'MercadoPago',on:1},{id:6,name:'Cocos Capital',on:1},{id:7,name:'IOL',on:1},{id:8,name:'HAPI',on:1}],
  pos:[
    {id:1,name:'BTC',type:'Cripto',plat:1,cur:'USD',amt:8100,age:0},
    {id:2,name:'BTC',type:'Cripto',plat:3,cur:'USD',amt:5000,age:0},
    {id:3,name:'ETH',type:'Cripto',plat:3,cur:'USD',amt:2600,age:0},
    {id:4,name:'USDT',type:'Stablecoin',plat:2,cur:'USD',amt:3000,age:0},
    {id:5,name:'USDC',type:'Stablecoin',plat:1,cur:'USD',amt:1500,age:0},
    {id:6,name:'SPY',type:'ETF',plat:7,cur:'USD',amt:12400,age:0},
    {id:7,name:'QQQ',type:'ETF',plat:6,cur:'USD',amt:6200,age:0},
    {id:8,name:'Fondo dólares',type:'Fondo',plat:6,cur:'USD',amt:3500,age:20},
    {id:9,name:'Fondo pesos',type:'Fondo',plat:7,cur:'ARS',amt:4200000,age:3},
    {id:10,name:'Dólares billete',type:'Efectivo',plat:4,cur:'USD',amt:4000,age:0},
    {id:11,name:'Saldo billetera',type:'Efectivo',plat:5,cur:'ARS',amt:800000,age:0}],
  nid:100
};
const DEFAULT_PLATS=()=>SAMPLE.plats.map(p=>({...p}));
const QDEF={fxAuto:true,fxSrc:'bolsa',fxAt:0,tdKey:'',quotesAt:0,syncHash:'',syncAt:0};
const S={tab:0,group:'Tipo',filter:'Todas',obj:{},plats:DEFAULT_PLATS(),pos:[],nid:100,fx:1450,sample:false,lastBackup:0,...QDEF};
let saveFail=false;
const dias=p=>Math.floor((Date.now()-(p.pxAt||p.upd||0))/864e5);
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const usd=p=>p.cur==='ARS'?p.amt/FX:p.amt;
/* preferencias no sensibles (ocultar importes, tema): se guardan aparte, sin cifrar */
let hide=false,theme='system';
try{const pr=JSON.parse(localStorage.getItem('cartera.prefs')||'{}');hide=!!pr.hide;theme=pr.theme||'system'}catch(e){}
function savePrefs(){try{localStorage.setItem('cartera.prefs',JSON.stringify({hide,theme}))}catch(e){}}
function applyTheme(){const r=document.documentElement;if(theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',theme)}
applyTheme();
const DOTS='••••••';
const FXNAME={bolsa:'MEP (bolsa)',oficial:'oficial',blue:'blue',contadoconliqui:'CCL',cripto:'cripto'};
const qStatus={busy:false,err:[]};
const ago=t=>{const m=Math.round((Date.now()-t)/60000);return m<1?'menos de 1 min':m<60?m+' min':m<1440?Math.round(m/60)+' h':Math.round(m/1440)+' días'};
const fU=n=>hide?'US$ '+DOTS:'US$ '+Math.round(n).toLocaleString('es-AR');
const fP=n=>hide?'$ '+DOTS:'$ '+Math.round(n*FX).toLocaleString('es-AR');
const fA=n=>hide?'$ '+DOTS:'$ '+Math.round(n).toLocaleString('es-AR');
const EYE='<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF='<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4.2M6.5 6.6C3.7 8.5 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>';
const pct=n=>(Math.round(n*10)/10).toLocaleString('es-AR')+'%';
const pname=id=>(S.plats.find(p=>p.id===id)||{name:'?'}).name;
const total=()=>S.pos.reduce((a,p)=>a+usd(p),0);
const COLORS=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
function curGroup(p){return p.cur==='ARS'?'Pesos':p.type==='Stablecoin'?'Stablecoins':p.type==='Cripto'?'Cripto':'Dólares'}
function groups(by){
  const m={};
  S.pos.forEach(p=>{const k=by==='Tipo'?p.type:by==='Plataforma'?pname(p.plat):curGroup(p);m[k]=(m[k]||0)+usd(p)});
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
function donut(data){
  const t=data.reduce((a,d)=>a+d[1],0),R=46,C=2*Math.PI*R;let off=0,out='';
  data.forEach((d,i)=>{const len=d[1]/t*C;
    out+=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${COLORS[i%6]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len});
  return `<svg width="128" height="128" viewBox="0 0 120 120" role="img" aria-label="Distribución">${out}</svg>`;
}
function legend(data){
  const t=data.reduce((a,d)=>a+d[1],0);
  return `<div class="leg">${data.map((d,i)=>`<div><span><span class="dot" style="background:${COLORS[i%6]}"></span>${esc(d[0])}</span><span class="num">${pct(d[1]/t*100)}</span></div>`).join('')}</div>`;
}
function bars(data){
  const t=data.reduce((a,d)=>a+d[1],0),mx=data[0]?data[0][1]:1;
  return data.map((d,i)=>`<div class="bl"><div class="t"><span>${esc(d[0])}</span><span class="num">${fU(d[1])} · ${pct(d[1]/t*100)}</span></div><div class="bar"><i style="width:${d[1]/mx*100}%;background:${COLORS[i%6]}"></i></div></div>`).join('');
}
function avisos(){
  const t=total(),A=[];
  const byP=groups('Plataforma');
  if(byP[0]&&byP[0][1]/t>.4)A.push(['w',`${pct(byP[0][1]/t*100)} está en ${byP[0][0]}`,'Tener mucho en una sola plataforma te expone si esa plataforma falla o te bloquea el acceso.']);
  const top=[...S.pos].sort((a,b)=>usd(b)-usd(a))[0];
  if(top&&usd(top)/t>.2)A.push(['w',`${top.name} en ${pname(top.plat)} pesa ${pct(usd(top)/t*100)}`,'Es tu mayor posición individual.']);
  const st=S.pos.filter(p=>p.type==='Stablecoin').reduce((a,p)=>a+usd(p),0);
  if(st/t>.05)A.push(['i',`Stablecoins: ${pct(st/t*100)} de la cartera`,'USDT y USDC dependen de su emisor y no son lo mismo que un dólar billete.']);
  const g=Object.fromEntries(groups('Moneda'));
  if((g['Pesos']||0)/t>.15)A.push(['i',`Pesos: ${pct((g['Pesos']||0)/t*100)}`,'Parte de tu cartera pierde valor frente al dólar si hay devaluación.']);
  Object.entries(S.obj).forEach(([k,v])=>{if(!v)return;const a=(Object.fromEntries(groups('Tipo'))[k]||0)/t*100;
    if(Math.abs(a-v)>=5)A.push(['w',`${k}: ${pct(a)} vs objetivo ${v}%`,a>v?`Estás ${pct(a-v)} puntos por encima.`:`Estás ${pct(v-a)} puntos por debajo.`])});
  S.pos.filter(p=>dias(p)>=14).forEach(p=>A.push(['i',`${p.name} sin actualizar hace ${dias(p)} días`,p.src&&p.src!=='manual'?`La cotización automática no llega (${pname(p.plat)}).`:`Valor cargado a mano en ${pname(p.plat)}.`]));
  const bk=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):null;
  if(bk===null)A.push(['w','Todavía no hiciste un respaldo','Exportá una copia cifrada desde Ajustes y guardala en un lugar seguro.']);
  else if(bk>=30)A.push(['i',`Último respaldo: hace ${bk} días`,'Exportá una copia nueva desde Ajustes.']);
  return A;
}
/* vistas */
const EMPTY=`<div class="top"><h1>Mi Cartera</h1></div><h2>Empezá cargando tu primera inversión</h2><p class="muted">Tocá Agregar y elegí la plataforma de tu lista. Con tus inversiones cargadas vas a ver acá los totales y los gráficos.</p>`;
function vResumen(){
  if(!S.pos.length)return EMPTY;
  const t=total(),d=groups(S.group),a=avisos().filter(x=>x[0]==='w')[0];
  return `<div class="top"><h1>Mi Cartera</h1>${S.sample?'<span class="ex">datos de ejemplo</span>':''}</div>
  <div class="muted sm">Patrimonio total</div><div class="big num">${fU(t)}</div><div class="num muted">${fP(t)}</div>
  <div class="sm muted" style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap"><button class="chip" data-q="1" ${qStatus.busy?'disabled':''}>${qStatus.busy?'Actualizando…':'↻ Actualizar'}</button><span>${S.quotesAt?'Cotizaciones de hace '+ago(S.quotesAt):'Sin cotizaciones automáticas todavía'}</span>
  ${driveOn()?`<button class="chip" data-d="1" ${dstat.busy?'disabled':''}>${dstat.busy?'Sincronizando…':dstat.state==='needtap'?'☁ Tocá para sincronizar':'☁ Sincronizar'}</button>${dstat.at?`<span>Drive: hace ${ago(dstat.at)}</span>`:''}`:''}</div>
  ${driveOn()&&dstat.err?`<div class="alert" style="margin-top:10px">${esc(dstat.err)}</div>`:''}
  ${qStatus.err.length?`<div class="alert" style="margin-top:10px">${qStatus.err.map(esc).join('<br>')}</div>`:''}
  ${a?`<div class="alert"><span>▲</span><span>${esc(a[1])}</span></div>`:''}
  <div class="chips" role="group" aria-label="Agrupar por">${['Tipo','Plataforma','Moneda'].map(k=>`<button class="chip" data-g="${k}" aria-pressed="${S.group===k}">${k}</button>`).join('')}</div>
  <div class="donut">${donut(d)}${legend(d)}</div>
  <div class="sec"><h2>Mayores posiciones</h2><div class="list">${[...S.pos].sort((a,b)=>usd(b)-usd(a)).slice(0,4).map(rowHtml).join('')}</div></div>
  <p class="muted sm sec">Tipo de cambio: US$ 1 = $ ${FX.toLocaleString('es-AR')} (${S.fxAuto?'dólar '+FXNAME[S.fxSrc]+', automático':'manual'}). Se cambia en Ajustes.</p>`;
}
function rowHtml(p){return `<button class="row" data-e="${p.id}"><div><b style="font-weight:500">${esc(p.name)}</b><small>${esc(pname(p.plat))} · ${p.type}${p.src&&p.src!=='manual'&&p.qty?' · '+p.qty.toLocaleString('es-AR')+' u.':''}</small></div><div class="r num">${p.cur==='ARS'?fA(p.amt):fU(p.amt)}<small>${p.cur==='ARS'?fU(usd(p)):fP(usd(p))}</small></div></button>`}
function vInv(){
  const plats=['Todas',...S.plats.filter(p=>p.on).map(p=>p.name)];
  const l=S.pos.filter(p=>S.filter==='Todas'||pname(p.plat)===S.filter).sort((a,b)=>usd(b)-usd(a));
  const sub=l.reduce((a,p)=>a+usd(p),0);
  return `<div class="top"><h1>Inversiones</h1><span class="num sm muted">${fU(sub)}</span></div>
  <div class="chips">${plats.map(k=>`<button class="chip" data-f="${esc(k)}" aria-pressed="${S.filter===k}">${esc(k)}</button>`).join('')}</div>
  <div class="list">${l.length?l.map(rowHtml).join(''):'<p class="muted">No hay inversiones en esta plataforma. Tocá Agregar para cargar la primera.</p>'}</div>`;
}
function vGraf(){
  if(!S.pos.length)return EMPTY;
  return `<div class="top"><h1>Gráficos</h1></div>
  <h2>Por plataforma</h2>${bars(groups('Plataforma'))}
  <div class="sec"><h2>Por moneda</h2>${bars(groups('Moneda'))}</div>
  <div class="sec"><h2>Por tipo</h2>${bars(groups('Tipo'))}</div>

const CG={BTC:'bitcoin',ETH:'ethereum',USDT:'tether',USDC:'usd-coin'};
async function getJSON(u){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);

let FCI=null;
async function fciList(){
  if(FCI)return FCI;
  const cats=['mercadoDinero','rentaFija','rentaVariable','rentaMixta','otros'];
  const parts=await Promise.all(cats.map(c=>getJSON('https://api.argentinadatos.com/v1/finanzas/fci/'+c+'/ultimo').catch(()=>[])));
  const m={};parts.flat().forEach(f=>{if(f&&f.fondo&&f.vcp>0)m[f.fondo]=f});
  if(!Object.keys(m).length)throw new Error('sin datos');
  return FCI=m;

const setPx=(p,v,at)=>{p.px=v;p.pxAt=at||Date.now();p.amt=(p.qty||0)*v};
async function refresh(){
  if(qStatus.busy||!KEY)return;

  const T=[],P=s=>S.pos.filter(p=>p.src===s&&p.qty>0);
  const cp=P('cripto');
  if(cp.length)T.push((async()=>{
    const ids=[...new Set(cp.map(p=>CG[p.sym]).filter(Boolean))];
    const d=await getJSON('https://api.coingecko.com/api/v3/simple/price?ids='+ids.join(',')+'&vs_currencies=usd');
    cp.forEach(p=>{const v=d[CG[p.sym]]&&d[CG[p.sym]].usd;if(v>0)setPx(p,v)});
  })().catch(()=>qStatus.err.push('No se pudieron traer las cotizaciones de cripto.')));
  const bp=P('bolsa');
  if(bp.length){
    if(!S.tdKey)qStatus.err.push('Falta la clave de Twelve Data (Ajustes) para cotizar ETF y acciones.');
    else T.push((async()=>{
      const syms=[...new Set(bp.map(p=>p.sym))];
      const d=await getJSON('https://api.twelvedata.com/price?symbol='+encodeURIComponent(syms.join(','))+'&apikey='+encodeURIComponent(S.tdKey));
      if(d.status==='error')throw new Error(d.message);
      bp.forEach(p=>{const r=syms.length===1?d:d[p.sym];const v=r&&parseFloat(r.price);if(v>0)setPx(p,v)});
    })().catch(()=>qStatus.err.push('No se pudieron traer las cotizaciones de ETF o acciones. Revisá la clave de Twelve Data.')));
  }
  const fp=P('fci');
  if(fp.length)T.push((async()=>{
    const L=await fciList();
    fp.forEach(p=>{const f=L[p.sym];if(f)setPx(p,f.vcp,Date.parse(f.fecha)||Date.now())});
  })().catch(()=>qStatus.err.push('No se pudieron traer los fondos comunes.')));
  if(S.fxAuto)T.push(getJSON('https://dolarapi.com/v1/dolares/'+S.fxSrc).then(d=>{if(d.venta>0){S.fx=FX=d.venta;S.fxAt=Date.now()}else throw 0}).catch(()=>qStatus.err.push('No se pudo traer el tipo de cambio. Se usa el último valor.')));
  await Promise.all(T);

}

/* cifrado y guardado: PBKDF2 (600.000 vueltas) deriva una clave AES-256-GCM de la contraseña; la clave vive solo en memoria */
const KEYSTORE='cartera.v1',ITER=600000;
let KEY=null,SALT=null,idle=null,hiddenAt=0;
const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>{let s='';u.forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pw,salt,iter){
  const km=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const snapshot=()=>({plats:S.plats,pos:S.pos,obj:S.obj,nid:S.nid,fx:S.fx,sample:S.sample,lastBackup:S.lastBackup,fxAuto:S.fxAuto,fxSrc:S.fxSrc,fxAt:S.fxAt,tdKey:S.tdKey,quotesAt:S.quotesAt,syncHash:S.syncHash,syncAt:S.syncAt});
async function seal(){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,te.encode(JSON.stringify(snapshot()))));
  return {v:1,at:Date.now(),iter:ITER,salt:b64(SALT),iv:b64(iv),ct:b64(ct)};
}
async function persist(){
  if(!KEY)return;
  try{localStorage.setItem(KEYSTORE,JSON.stringify(await seal()));saveFail=false}catch(e){saveFail=true}
  scheduleSync();
}
async function open(blob,pw){
  const salt=unb64(blob.salt),key=await derive(pw,salt,blob.iter||ITER);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(blob.iv)},key,unb64(blob.ct));
  return {key,salt,data:JSON.parse(td.decode(pt))};
}

/* huella: WebAuthn con extensión PRF. La huella genera una clave que abre la contraseña guardada cifrada; sin la huella del celular esa clave no existe */
const BIOKEY='cartera.bio';
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
function bioStored(){try{return JSON.parse(localStorage.getItem(BIOKEY))}catch(e){return null}}
function bioErr(x,def){
  if(x&&x.name==='NotAllowedError')return 'Cancelaste la huella.';
  if(x&&x.message==='noprf')return 'Este celular no permite usar la huella como llave.';
  if(x&&x.name==='OperationError')return 'Contraseña incorrecta.';
  return def;
}
async function prfRaw(cid,salt){
  const cred=await navigator.credentials.get({publicKey:{challenge:rnd(32),rpId:location.hostname,allowCredentials:[{type:'public-key',id:unb64(cid)}],userVerification:'required',timeout:60000,extensions:{prf:{eval:{first:unb64(salt)}}}}});
  const r=cred.getClientExtensionResults().prf;
  if(!r||!r.results||!r.results.first)throw new Error('noprf');
  return r.results.first;
}
async function keyFrom(raw){
  const km=await crypto.subtle.importKey('raw',raw,'HKDF',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:new Uint8Array(32),info:te.encode('cartera-bio-v1')},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const prfKey=async(cid,salt)=>keyFrom(await prfRaw(cid,salt));
/* el pedido de huella va primero, apenas se toca el botón; la contraseña se verifica después */
async function enableBio(pw,say){
  say('Confirmá con tu huella o el bloqueo del celular…');
  const salt=rnd(32);
  const cred=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'Mi Cartera',id:location.hostname},user:{id:rnd(16),name:'mi-cartera',displayName:'Mi Cartera'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'required'},timeout:60000,extensions:{prf:{eval:{first:salt}}}}});
  const ext=cred.getClientExtensionResults();
  if(!ext.prf)throw new Error('noprf');
  say('Comprobando la contraseña…');
  await open(stored(),pw);
  const cid=b64(new Uint8Array(cred.rawId));
  let raw=ext.prf.results&&ext.prf.results.first;
  if(!raw){say('Confirmá la huella una vez más…');raw=await prfRaw(cid,b64(salt))}
  const key=await keyFrom(raw),iv=rnd(12);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(pw)));
  localStorage.setItem(BIOKEY,JSON.stringify({v:1,cid,prfSalt:b64(salt),iv:b64(iv),ct:b64(ct)}));
}
async function bioUnlock(auto){
  const bio=bioStored(),b=stored(),err=$('#lerr');if(!bio||!b||KEY)return;
  err.textContent='';
  try{
    const key=await prfKey(bio.cid,bio.prfSalt);
    const pw=td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(bio.iv)},key,unb64(bio.ct)));
    $('#go').textContent='Abriendo…';
    const r=await open(b,pw);KEY=r.key;SALT=r.salt;load(r.data);enter();
  }catch(x){
    if(!(auto&&x&&x.name==='NotAllowedError'))err.textContent=bioErr(x,'No se pudo usar la huella. Usá la contraseña.');
  }finally{lockMode()}
}
$('#go').onclick=async()=>{
  const pw=$('#pw').value,b=stored(),err=$('#lerr'),btn=$('#go');err.textContent='';
  if(!pw){err.textContent='Escribí tu contraseña maestra.';return}
  if(!window.crypto||!crypto.subtle){err.textContent='Este navegador no permite cifrar. Abrí la app desde su dirección https.';return}
  try{
    if(!b){
      if(pw.length<10){err.textContent='Usá al menos 10 caracteres. Una frase de varias palabras es mejor.';return}
      if(pw!==$('#pw2').value){err.textContent='Las contraseñas no coinciden.';return}
      btn.disabled=true;btn.textContent='Creando…';
      SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await derive(pw,SALT,ITER);resetState();await persist();
    }else{
      btn.disabled=true;btn.textContent='Abriendo…';
      const r=await open(b,pw);KEY=r.key;SALT=r.salt;load(r.data);
    }
    $('#pw').value='';$('#pw2').value='';enter();
  }catch(e){KEY=null;err.textContent=b?'Contraseña incorrecta.':'No se pudo crear. Probá de nuevo.'}
  finally{btn.disabled=false;lockMode()}
};
$('#pw').onkeydown=e=>{if(e.key==='Enter'){if($('#pw2').hidden)$('#go').click();else $('#pw2').focus()}};
$('#pw2').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
/* Google Drive: copia cifrada en la carpeta oculta de la app (permiso drive.appdata). Solo se sube el archivo ya cifrado */
const CLIENT_ID='870795784766-3kjg6f3b27hgdidc0833fd6rt9qb4u30.apps.googleusercontent.com';
const SCOPE='https://www.googleapis.com/auth/drive.appdata',DFILE='cartera.enc';
const dstat={busy:false,state:'idle',err:'',at:0};
let TOK=null,TOKEXP=0,syncTimer=null;
const driveOn=()=>{try{return localStorage.getItem('cartera.drive')==='1'}catch(e){return false}};
const setDrive=v=>{try{v?localStorage.setItem('cartera.drive','1'):localStorage.removeItem('cartera.drive')}catch(e){}};
const tokOk=()=>!!TOK&&Date.now()<TOKEXP-60000;
function getToken(){
  if(tokOk())return Promise.resolve(TOK);
  return new Promise((res,rej)=>{
    if(!(window.google&&google.accounts&&google.accounts.oauth2))return rej(new Error('No cargó el servicio de Google. Revisá la conexión.'));
    const tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,
      callback:r=>{if(r.error)return rej(new Error('Google no autorizó: '+(r.error_description||r.error)));TOK=r.access_token;TOKEXP=Date.now()+(r.expires_in||3600)*1000;res(TOK)},
      error_callback:e=>rej(new Error(e&&e.type==='popup_closed'?'Cerraste la ventana de Google.':e&&e.type==='popup_failed_to_open'?'El navegador bloqueó la ventana de Google. Tocá Sincronizar.':'No se pudo autorizar con Google.'))});
    tc.requestAccessToken({prompt:''});
  });
}
async function dapi(url,opt={}){
  const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+TOK,...(opt.headers||{})}});
  if(r.status===401){TOK=null;throw new Error('Google pidió autorizar de nuevo. Tocá Sincronizar.')}
  if(!r.ok)throw new Error('Drive respondió '+r.status+'.');
  return r;
}
async function dFind(){
  const r=await dapi('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q='+encodeURIComponent("name='"+DFILE+"'"));
  const j=await r.json();return j.files&&j.files[0]||null;
}
async function dGet(id){return (await dapi('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media')).json()}
async function dPut(id,blob){
  const body=JSON.stringify(blob);
  if(id){await dapi('https://www.googleapis.com/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});return id}
  const bd='b'+Date.now(),meta=JSON.stringify({name:DFILE,parents:['appDataFolder']});
  const mp='--'+bd+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+bd+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+bd+'--';
  const r=await dapi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body:mp});
  return (await r.json()).id;
}
/* huella de los datos sin los campos que cambian solos; sirve para saber si hubo cambios desde la última sincronización */
async function dhash(){
  const d=snapshot();['syncHash','syncAt','quotesAt','fxAt'].forEach(k=>delete d[k]);
  return b64(new Uint8Array(await crypto.subtle.digest('SHA-256',te.encode(JSON.stringify(d)))));
}
async function pushLocal(id){
  const h=await dhash(),blob=await seal(),nid=await dPut(id,blob);
  S.syncAt=blob.at;S.syncHash=h;dstat.at=Date.now();return nid;
}
async function adopt(remote,pw){
  let key=KEY,salt=SALT,data;
  if(remote.salt===b64(SALT)){data=JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(remote.iv)},KEY,unb64(remote.ct))))}
  else{const r=await open(remote,pw);key=r.key;salt=r.salt;data=r.data}
  KEY=key;SALT=salt;load(data);S.syncAt=remote.at;S.syncHash=await dhash();dstat.at=Date.now();await persist();
}
async function useDrive(remote){
  if(remote.salt===b64(SALT)){await adopt(remote);closeSheet();render();return true}
  modal('Contraseña de la copia de Drive','<p class="muted sm">La copia de Drive se cifró con otra clave. Ingresá la contraseña maestra que tenía.</p><label for="dpw">Contraseña</label><input id="dpw" type="password" autocomplete="off">','Restaurar',async()=>{
    try{await adopt(remote,$('#dpw').value);closeSheet();render();return true}catch(e){return 'Contraseña incorrecta.'}});
  return true;
}
function askConflict(c){
  modal('Hay dos versiones','<p>Cambiaste datos en este celular y la copia de Drive también cambió. ¿Cuál querés conservar?</p><button class="btn sec2" id="ckeep">Conservar la de este celular</button>','Usar la de Drive',()=>useDrive(c.remote));
  $('#ckeep').onclick=async()=>{
    try{await pushLocal(c.id);dstat.state='ok';dstat.err=''}catch(e){dstat.state='err';dstat.err=e.message}
    closeSheet();await persist();redraw();
  };
}
async function sync(interactive){
  if(!KEY||dstat.busy||!driveOn())return;
  if(!tokOk()&&!interactive){dstat.state='needtap';redraw();return}
  dstat.busy=true;dstat.err='';dstat.state='busy';redraw();
  let conflict=null;
  try{
    await getToken();
    const meta=await dFind(),h=await dhash();
    if(!meta)await pushLocal(null);
    else{
      const remote=await dGet(meta.id),rc=remote.at!==S.syncAt,lc=h!==S.syncHash;
      if(rc&&lc)conflict={remote,id:meta.id};
      else if(rc)await useDrive(remote);
      else if(lc)await pushLocal(meta.id);
      else dstat.at=dstat.at||Date.now();
    }
    if(!conflict)dstat.state='ok';
  }catch(e){dstat.state=/autoriz|ventana|bloque/i.test(e.message)?'needtap':'err';dstat.err=e.message}
  finally{dstat.busy=false}
  await persist();redraw();
  if(conflict)askConflict(conflict);
}
function scheduleSync(){
  if(!driveOn()||!tokOk()||dstat.busy||!KEY||dstat.state==='err')return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(async()=>{if(KEY&&await dhash()!==S.syncHash)sync(false)},4000);
}
async function restoreDrive(){
  const err=$('#lerr'),pw=$('#pw').value;err.textContent='';
  if(!pw){err.textContent='Escribí arriba la contraseña maestra que usabas.';return}
  try{
    err.textContent='Conectando con Google…';
    await getToken();
    const meta=await dFind();
    if(!meta){err.textContent='No hay una copia en este Google Drive.';return}
    const remote=await dGet(meta.id);
    err.textContent='Abriendo…';
    const r=await open(remote,pw);
    KEY=r.key;SALT=r.salt;resetState();load(r.data);
    S.syncAt=remote.at;S.syncHash=await dhash();dstat.at=Date.now();dstat.state='ok';
    setDrive(true);await persist();
    $('#pw').value='';$('#pw2').value='';err.textContent='';enter();
  }catch(e){KEY=null;err.textContent=e&&e.name==='OperationError'?'Contraseña incorrecta.':(e&&e.message)||'No se pudo restaurar.'}
}
$('#fp').onclick=()=>bioUnlock(false);
lockMode();
if(bioStored()&&stored())setTimeout(()=>bioUnlock(true),400);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
/* eventos */
document.addEventListener('click',e=>{
  if(e.target.closest('[data-q]')){refresh();return}
  if(e.target.closest('[data-d]')){sync(true);return}
  if(e.target.id==='drvon'){dstat.err='';getToken().then(()=>{setDrive(true);dstat.state='idle';render();sync(true)}).catch(x=>{dstat.err=x.message;render()});return}
  if(e.target.id==='drvsync'){sync(true);return}
  if(e.target.id==='drvoff'){try{if(TOK)google.accounts.oauth2.revoke(TOK)}catch(x){}TOK=null;setDrive(false);dstat.state='idle';dstat.err='';render();return}
  if(e.target.id==='rst'){restoreDrive();return}
  const ey=e.target.closest('[data-eye]');
  if(ey){hide=!hide;savePrefs();render();return}
  const th=e.target.closest('[data-th]');
  if(th){theme=th.dataset.th;savePrefs();applyTheme();render();return}
  const g=e.target.closest('[data-g],[data-f],[data-t],[data-e],[data-pr],[data-pa]');
  if(g){const d=g.dataset;
    if(d.g){S.group=d.g;render()}
    else if(d.f){S.filter=d.f;render()}
    else if(d.t){S.tab=+d.t;render();scrollTo(0,0)}
    else if(d.e)openSheet(+d.e);
    else if(d.pa){const p=S.plats.find(x=>x.id===+d.pa);p.on=p.on?0:1;if(!p.on&&S.filter===p.name)S.filter='Todas';render()}
    else if(d.pr){const p=S.plats.find(x=>x.id===+d.pr),row=g.closest('.row');
      row.innerHTML=`<input id="rn" value="${esc(p.name)}" aria-label="Nuevo nombre"><button class="chip" id="rs" style="margin-left:8px">Guardar</button>`;
      $('#rs').onclick=()=>{const v=$('#rn').value.trim();if(v)p.name=v;render()}}
  }
  if(e.target.id==='fab')openSheet();

  const id=e.target.id;

  if(id==='bki')$('#bkf').click();
  if(id==='smp'){loadSample()}
  if(id==='smpx'){S.pos=[];S.sample=false;render()}
  if(id==='cpw')askPw();
  if(id==='biooff'){try{localStorage.removeItem(BIOKEY)}catch(x){}render()}
  if(id==='bioon')modal('Activar huella','<p class="muted sm">Vas a confirmar con tu huella dos veces. Después vas a poder entrar sin escribir la contraseña. Si cambiás la contraseña maestra, la huella se desactiva.</p><label for="bpw">Contraseña maestra</label><input id="bpw" type="password" autocomplete="off">','Activar',async(say)=>{
    const pw=$('#bpw').value;if(!pw)return 'Escribí tu contraseña maestra.';
    try{await enableBio(pw,say);closeSheet();render();return true}
    catch(x){return bioErr(x,'No se pudo activar la huella ('+(x&&x.name)+': '+(x&&x.message)+').')}});
  if(id==='wipe'){if(!e.target.dataset.sure){e.target.dataset.sure=1;e.target.textContent='¿Seguro? Se borra todo en este celular (la copia de Drive no). Tocá de nuevo'}else wipeAll()}
});
document.addEventListener('change',async e=>{
  const cid=e.target.id;
  if(cid==='fxauto'){S.fxAuto=e.target.checked;render();if(S.fxAuto)refresh();return}
  if(cid==='fxsrc'){S.fxSrc=e.target.value;persist();if(S.fxAuto)refresh();return}

  modal('Importar respaldo','<p class="muted sm">Reemplaza lo que hay ahora. Ingresá la contraseña que tenía el respaldo.</p><label for="ipw">Contraseña del respaldo</label><input id="ipw" type="password" autocomplete="off">','Importar',async()=>{
    try{const r=await open(blob,$('#ipw').value);load(r.data);await persist();closeSheet();render();return true}
    catch(x){return 'Contraseña incorrecta.'}})
});
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.o;
  if(k){const v=parseFloat(e.target.value);S.obj[k]=v>0?v:0;persist()}

async function diag(){
  const o=$('#dout');o.hidden=false;const L=[];
  L.push('Conexión segura (HTTPS): '+(window.isSecureContext?'sí':'no'));
  L.push('WebAuthn disponible: '+(window.PublicKeyCredential?'sí':'no'));
  try{if(window.PublicKeyCredential){
    L.push('Sensor de huella / bloqueo de pantalla: '+(await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()?'sí':'no'));
    if(PublicKeyCredential.getClientCapabilities){const c=await PublicKeyCredential.getClientCapabilities();
      L.push('Extensión PRF (huella como llave): '+(c['extension:prf']?'sí':'no'))}
    else L.push('Extensión PRF: no se puede consultar en este navegador');
  }}catch(e){L.push('Consulta bloqueada en esta vista. El resultado vale al abrir la app instalada.')}
  L.push('','Si PRF dice "sí": la huella protege los datos de verdad.','Si dice "no": se usa el plan B (contraseña cada 7 días).');
  o.textContent=L.join('\n');
}
